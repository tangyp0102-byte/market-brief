  - id: wti
    name: WTI Crude (front)
    tier: core
    asset_class: commodity
    quote_unit: usd
    change_unit: pct
    sources:
      - {provider: yahoo, symbol: "CL=F"}
    tradingview: "NYMEX:CL1!"
    # Front-month WTI settled at -$37.63 on 2020-04-20. Negative prices are real
    # market history, not bad ticks. NOTE: percent changes across a sign flip are
    # meaningless; the step-2 validation gate must flag sign crossings rather
    # than compute a change through zero.
    bounds: {min: -60.0, max: 250.0}
    max_abs_change: 25
    stale_tolerance_days: 1

