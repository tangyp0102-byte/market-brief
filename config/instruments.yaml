# Instrument registry for the daily cross-asset brief.
#
# UNIT CONVENTIONS (the thing most likely to be silently wrong):
#   quote_unit   - what a raw stored value means:
#                    percent   -> 4.25 means 4.25%
#                    index     -> index points (SPX, VIX)
#                    usd       -> price in USD
#                    fx_rate   -> units of quote ccy per base ccy
#   change_unit  - how a day-over-day change is expressed:
#                    bp   -> (curr - prev) * 100      [only for quote_unit: percent]
#                    pct  -> (curr / prev - 1) * 100  [prices, indices, fx]
#                    pts  -> (curr - prev)            [VIX and other point-quoted vols]
#   dollar_direction - FX ONLY. +1 if a RISE in this quote means a STRONGER dollar.
#                      This is explicit rather than inferred because Yahoo's short-form
#                      tickers are a trap: "EURUSD=X" is EUR/USD but "JPY=X" is USD/JPY.
#
# sources: ordered list, index 0 is primary, rest are fallbacks.
# bounds: hard sanity range on the LEVEL. Outside -> reject, never store.
# max_abs_change: hard sanity range on the day-over-day CHANGE, in change_unit.
# stale_tolerance_days: how many business days old a value may be before flagged stale.
#                       FRED ICE BofA OAS series publish T+1, hence 2.

meta:
  # All change calculations compare consecutive stored session dates for the
  # same instrument. See README for the snapshot-time convention.
  version: 1
  zscore_window: 60
  zscore_min_obs: 30

