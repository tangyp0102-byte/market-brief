  # SUBSTITUTION, not a rename. Offshore CNH is the better risk-sentiment signal
  # because it floats freely, but Yahoo has no usable CNH history (both CNH=X and
  # USDCNH=X return a single row). Onshore CNY is managed by the PBoC within a
  # daily band around its fix, so it moves less and is partly a policy decision
  # rather than a market price. Treat CNY moves as a weaker, laggier signal than
  # CNH would have been, and do not read small daily changes as market sentiment.
  - id: usdcny
    name: USD/CNY (onshore, PBoC-managed)
    asset_class: fx
    quote_unit: fx_rate
    change_unit: pct
    dollar_direction: 1
    sources:
      - {provider: yahoo, symbol: "CNY=X"}
      - {provider: yahoo, symbol: "USDCNY=X"}
    tradingview: "FX_IDC:USDCNY"
    bounds: {min: 4.0, max: 12.0}
    max_abs_change: 4
    stale_tolerance_days: 1

